name: Build APK
on: 
  push:
    branches: [ main, master, основной ] # Добавил твою ветку "основной"
  workflow_dispatch: # Позволит запускать сборку кнопкой

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build with Buildozer
        uses: En-S/buildozer-action@v1.2.2 # Используем стабильную версию
        with:
          buildozer_version: master
          python_version: 3.11

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: my-app-apk
          path: bin/*.apk
